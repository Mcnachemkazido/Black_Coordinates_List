services:
  db:
    image: redis:latest
    container_name: data
    ports:
        - "6379:6379"


  app:
    build: service_b/app

    container_name: fastapi-redis

    environment:
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_USER: ${REDIS_USER}
      REDIS_PASS: ${REDIS_PASS}

    ports:
      - "8000:8000"




